name: Upload Python Package on PyPI

on:
  release:
    types: [published]
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: Build the packages
    runs-on: ubuntu-latest
    if: |
      github.repository == 'xarray-contrib/xdggs'
      && (
        github.event_name == 'release'
        || (
          github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'release')
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install publish dependencies
        run: python -m pip install build twine
      - name: Build package
        run: python -m build . -o dist
      - name: Check built artifacts
        run: |
          python -m twine check --strict dist/*
          pwd
          if [ -f dist/xdggs-0.1.*.tar.gz ]; then
            echo "❌ INVALID VERSION NUMBER"
            exit 1
          else
            echo "✅ Looks good"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: releases
          path: dist

  deploy:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: github.event_name == 'release'

    environment:
      name: pypi
      url: https://pypi.org/p/xdggs
    permissions:
      id-token: write # for publishing the build artifacts to pypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: releases
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
          packages-dir: dist/
