name: Upstream-dev CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, labeled]
  schedule:
    - cron: "0 0 * * 1" # Mondays “At 00:00” UTC
  workflow_dispatch: # allows you to trigger the workflow run manually

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-ci-trigger:
    name: detect ci trigger
    runs-on: ubuntu-latest
    if: |
      github.repository_owner == 'xarray-contrib' && github.event_name == 'pull_request'
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: xarray-contrib/ci-trigger@10cd2bfec3484946a4058a421ddf9cfad101e715 # v1.2.1
        id: detect-trigger
        with:
          keyword: "[test-upstream]"

  cache-pixi-lock:
    name: cache pixi lock file
    runs-on: ubuntu-slim
    needs: detect-ci-trigger
    if: |
      always()
      && github.repository_owner == 'xarray-contrib'
      && (
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        || needs.detect-ci-trigger.outputs.triggered == 'true'
        || contains( github.event.pull_request.labels.*.name, 'run-upstream')
      )

    env:
      MANIFEST_PATH: "ci/nightly/pixi.toml"

    outputs:
      cache-key: ${{ steps.pixi-lock.outputs.cache-key }}
      pixi-version: ${{ steps.pixi-lock.outputs.pixi-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Parcels-code/pixi-lock/create-and-cache@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        id: pixi-lock
        with:
          manifest-path: ${{ env.MANIFEST_PATH }}
          hash-files: |
            pyproject.toml
            ${{ env.MANIFEST_PATH }}

  tests:
    name: upstream-dev
    runs-on: ubuntu-latest
    needs: cache-pixi-lock

    defaults:
      run:
        shell: bash -l {0}

    env:
      MANIFEST_PATH: "ci/nightly/pixi.toml"

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags
          persist-credentials: false

      - uses: Parcels-code/pixi-lock/restore@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        with:
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}
          manifest-path: ${{ env.MANIFEST_PATH }}

      - name: setup environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          manifest-path: ${{ env.MANIFEST_PATH }}
          environments: "nightly"
          pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
          cache: true
          frozen: true

      - name: Import xdggs
        run: |
          pixi run --manifest-path "$MANIFEST_PATH" -e nightly python -c "import xdggs"

      - name: run tests
        if: success()
        id: status
        run: |
          pixi run --manifest-path "$MANIFEST_PATH" -e nightly tests -rf --report-log=pytest-log.jsonl

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.status.outcome == 'failure'
        with:
          name: log file
          path: pytest-log.jsonl

  report:
    name: report upstream-dev failures
    runs-on: ubuntu-latest
    needs: tests

    if: |
      needs.tests.result == 'failure'
      && github.event_name == 'schedule'
      && github.repository_owner == 'xarray-contrib'

    permissions:
      issues: write # for opening / modifying the reported issues

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: log file
          path: logs/

      - name: Generate and publish a failure report
        if: |
          failure()
          && steps.run-tests.outcome == 'failure'
          && github.event_name == 'schedule'
          && github.repository_owner == 'xarray-contrib'
        uses: scientific-python/issue-from-pytest-log-action@87351a8f864e969567cda22a25a2f214cbe2340f # v1.6.0
        with:
          log-path: logs/pytest-log.jsonl
